name: Chomyfin CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    - name: Restore dependencies
      run: dotnet restore Chomyfin.csproj
    - name: Build
      run: dotnet build Chomyfin.csproj -c Release --no-restore
    - name: Run Tests
      run: dotnet run --project Chomyfin.Tests/Chomyfin.Tests.csproj -c Release
